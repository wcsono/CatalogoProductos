<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo de Accesorios TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 👈 clave para móvil -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container my-4">
    <h1 class="text-center mb-4">Catálogo de Accesorios TV</h1>
    <div id="productos" class="row g-4"></div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="productoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="modalNombre" class="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <img id="modalImagen" class="img-fluid mb-3" alt="Imagen producto">
          <p id="modalDescripcion"></p>
          <p><strong>Precio: </strong><span id="modalPrecio"></span></p>
          <a id="modalEnlace" href="#" target="_blank" class="btn btn-primary">Ver Tutorial</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
